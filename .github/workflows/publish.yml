name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    name: Publish alpha
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --omit=optional
      - run: npm run verify
      - run: npm pack --json
      - run: node scripts/write-checksums.mjs .tgz
      - run: node scripts/verify-checksums.mjs SHA256SUMS.txt
      - run: npm run ci-artifact:review -- --dir .
      - run: npm publish gemstone-js-*.tgz --access public --tag alpha --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
