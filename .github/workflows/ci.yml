name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --omit=optional
      - run: npm run verify
      - run: npm pack --json
      - run: node scripts/write-checksums.mjs .tgz
      - run: node scripts/verify-checksums.mjs SHA256SUMS.txt
      - run: npm run ci-artifact:review -- --dir .
      - uses: actions/upload-artifact@v4
        with:
          name: gemstone-js-package-node-${{ matrix.node }}
          path: |
            *.tgz
            SHA256SUMS.txt
